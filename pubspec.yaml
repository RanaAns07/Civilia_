name: civilia_app
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  firebase_core: ^2.32.0
  firebase_auth: ^4.20.0
  cloud_firestore: ^4.17.4
  http: ^1.2.1
  shared_preferences: ^2.2.3
  google_maps_flutter: ^2.6.1
  geolocator: ^12.0.0
  geocoding: ^3.0.0
  image_picker: ^1.1.2
  flutter_markdown: ^0.7.0+1
  mime: ^1.0.5
  provider: ^6.1.2
  google_fonts: ^6.2.1
  flutter_local_notifications: ^17.1.2
  permission_handler: ^11.3.1

  flutter_launcher_icons: ^0.13.1
  flutter_ble_peripheral: ^1.0.3
  flutter_blue_plus: ^1.30.0
#  flutter_nearby_connections: ^1.1.2 # Check pub.dev for the latest version


  
  uuid: ^4.0.0







dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/img.png"

flutter:
